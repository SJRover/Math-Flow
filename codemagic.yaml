workflows:
  ios-capacitor-app-store:
    name: Math Flow iOS App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Personal"
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Automatically create and fetch signing profiles
        script: |
          app-store-connect fetch-signing-files "com.samjo.beastflowevolution" \
            --type IOS_APP_STORE \
            --create
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
